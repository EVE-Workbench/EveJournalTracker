name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '9.0.x'
  CONFIGURATION: Release
  # The Avalonia client is the cross-platform app shipped on every OS (the legacy WPF
  # project is being retired and is no longer built/released).
  PROJECT_PATH: UI.avalonia/UI.avalonia.csproj
  APP_NAME: EWBAgent

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RUNTIME_ID: win-x64
      OUTPUT_DIR: publish/win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c ${{ env.CONFIGURATION }}
          -r ${{ env.RUNTIME_ID }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o ${{ env.OUTPUT_DIR }}

      - name: Rename app host
        shell: pwsh
        run: |
          $exe = Join-Path $env:OUTPUT_DIR 'UI.avalonia.exe'
          if (Test-Path $exe) { Rename-Item $exe "$env:APP_NAME.exe" }

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path "$env:OUTPUT_DIR/*" -DestinationPath "$env:APP_NAME-win-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ${{ env.APP_NAME }}-win-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    env:
      RUNTIME_ID: linux-x64
      OUTPUT_DIR: publish/linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c ${{ env.CONFIGURATION }}
          -r ${{ env.RUNTIME_ID }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o ${{ env.OUTPUT_DIR }}

      - name: Rename app host
        run: |
          if [ -f "$OUTPUT_DIR/UI.avalonia" ]; then
            mv "$OUTPUT_DIR/UI.avalonia" "$OUTPUT_DIR/$APP_NAME"
          fi
          chmod +x "$OUTPUT_DIR/$APP_NAME"

      - name: Create tarball
        run: tar -czf "$APP_NAME-linux-x64.tar.gz" -C "$OUTPUT_DIR" .

      - name: Build AppImage
        run: |
          set -e
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp -r "$OUTPUT_DIR"/. "$APPDIR/usr/bin/"

          cp UI.avalonia/Assets/eveworkbench-logo.png "$APPDIR/ewbagent.png"

          cat > "$APPDIR/ewbagent.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=EVE Workbench Agent
          Comment=Companion app for the EVE Journal (bounty and game-log tracking)
          Exec=$APP_NAME
          Icon=ewbagent
          Categories=Utility;Game;
          Terminal=false
          EOF

          cat > "$APPDIR/AppRun" <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/$APP_NAME" "\$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "$APP_NAME-x86_64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            ${{ env.APP_NAME }}-linux-x64.tar.gz
            ${{ env.APP_NAME }}-x86_64.AppImage

  publish-assets:
    needs: [build-windows, build-linux]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          TAG="${{ github.event.release.tag_name }}"
          : > RELEASE_NOTES.md
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$TAG" '
              index($0, "## ") == 1 && index($0, tag) > 0 { flag=1; next }
              flag && index($0, "## ") == 1 { flag=0 }
              flag { print }
            ' CHANGELOG.md > RELEASE_NOTES.md || true
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." > RELEASE_NOTES.md
          fi

      - name: Attach assets and notes to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
